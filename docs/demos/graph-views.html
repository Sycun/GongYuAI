<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图视图族：资产/攻击面/执行/记忆四图切换演示</title>
<style>
:root {
  --seed-fg:#1f2329; --seed-muted:#6b7280; --seed-primary:#2563eb;
  --border-standard:#d1d5db; --border-subtle:#e5e7eb;
  --card-bg:#ffffff; --inset-bg:#f3f4f6; --fill-1:#f9fafb; --fill-2:#f3f4f6; --fill-3:#e5e7eb;
  --font-sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --viz-series-1:#3b82f6; --viz-series-2:#10b981; --viz-series-3:#ef4444;
  --viz-series-4:#8b5cf6; --viz-series-5:#f59e0b; --viz-series-6:#06b6d4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --seed-fg:#e5e7eb; --seed-muted:#9ca3af; --seed-primary:#60a5fa;
    --border-standard:#374151; --border-subtle:#1f2937;
    --card-bg:#111827; --inset-bg:#0b1220; --fill-1:#1f2937; --fill-2:#374151; --fill-3:#4b5563;
    --viz-series-1:#60a5fa; --viz-series-2:#34d399; --viz-series-3:#f87171;
    --viz-series-4:#a78bfa; --viz-series-5:#fbbf24; --viz-series-6:#22d3ee;
  }
}
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--inset-bg); color:var(--seed-fg); font-family:var(--font-sans); }
.card { background:var(--card-bg); border:1px solid var(--border-subtle); border-radius:12px; }
#gy-atlas { max-width:1600px; margin:0 auto; }
</style>
</head>
<body>
<div id="gy-graph-views">
  <style>
    #gy-graph-views .gv-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    #gy-graph-views .gv-tabs button { font-size:13px; padding:6px 14px; border-radius:8px; border:1px solid var(--border-standard); background:var(--fill-1); color:var(--seed-fg); cursor:pointer; }
    #gy-graph-views .gv-tabs button[aria-pressed="true"] { background:var(--fill-3); border-color:var(--seed-primary); font-weight:500; }
    #gy-graph-views .gv-note { font-size:12px; color:var(--seed-muted); margin:0 0 8px; }
    #gy-graph-views svg { width:100%; min-width:700px; height:auto; display:block; }
    #gy-graph-views .gv-node { cursor:pointer; }
    #gy-graph-views .gv-node rect.gv-body { transition:fill .15s ease; }
    #gy-graph-views .gv-node:hover rect.gv-body, #gy-graph-views .gv-node:focus rect.gv-body { fill:var(--fill-2); }
    #gy-graph-views .gv-node.gv-selected rect.gv-body { fill:var(--fill-2); stroke-width:2.5; }
    #gy-graph-views .gv-node:focus { outline:none; }
    #gy-graph-views .gv-node:focus rect.gv-focusring { stroke:var(--seed-primary); stroke-width:2; stroke-dasharray:4 3; }
    #gy-graph-views .gv-edge { stroke:var(--seed-muted); stroke-width:1.4; fill:none; }
    #gy-graph-views .gv-dash { stroke-dasharray:5 4; }
    #gy-graph-views .gv-edge-label { font-size:12px; fill:var(--seed-muted); }
    #gy-graph-views .gv-title { font-size:13px; font-weight:500; fill:var(--seed-fg); }
    #gy-graph-views .gv-sub { font-size:12px; fill:var(--seed-muted); }
    #gy-graph-views .gv-lane { font-size:12px; font-weight:500; fill:var(--seed-muted); }
    #gy-graph-views #gv-detail { margin-top:10px; padding:12px 14px; }
    #gy-graph-views #gv-detail h3 { margin:0 0 6px; font-size:13px; font-weight:500; color:var(--seed-fg); }
    #gy-graph-views #gv-detail ul { margin:0; padding-left:18px; }
    #gy-graph-views #gv-detail li { font-size:13px; color:var(--seed-fg); margin:3px 0; }
    #gy-graph-views #gv-detail .gv-src { font-size:12px; color:var(--seed-muted); margin-top:8px; }
    @media (prefers-reduced-motion: reduce) { #gy-graph-views .gv-node rect.gv-body { transition:none; } }
  </style>

  <div class="gv-tabs" role="tablist" aria-label="图视图切换">
    <button role="tab" aria-pressed="true" data-view="asset">资产图 · G1 数据已有</button>
    <button role="tab" aria-pressed="false" data-view="surface">攻击面图 · G2 依赖 P6</button>
    <button role="tab" aria-pressed="false" data-view="exec">执行图 · G1 数据已有</button>
    <button role="tab" aria-pressed="false" data-view="memory">记忆图 · G3 = P8</button>
  </div>
  <p class="gv-note" id="gv-note">同一实体跨图同 ID：点节点看规范，详情面板给「在其他图中查看」的跳转语义。示例数据贯穿四图。</p>

  <div class="table-responsive">
    <svg id="gv-svg" viewBox="0 0 980 430" role="group" aria-label="四图视图族概念演示">
      <defs>
        <marker id="gv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--seed-muted)"></path>
        </marker>
      </defs>
      <g id="gv-view-asset"></g>
      <g id="gv-view-surface" style="display:none"></g>
      <g id="gv-view-exec" style="display:none"></g>
      <g id="gv-view-memory" style="display:none"></g>
    </svg>
  </div>

  <div id="gv-detail" class="card" aria-live="polite"></div>

  <script>
  (function () {

        overview: { t:'资产图（G1 · 数据已有）', b:[

        overview: { t:'攻击面图（G2 · 依赖 P6 E3/E4）', b:[
          '三层节点：资产 → 表面元素（port/service/endpoint）→ 测试状态；finding 徽章 tentative 灰 / verified 亮。',

        nodes: [

          { id:'s-login', x:620, y:60, w:190, h:50, c:4, title:'/login', sub:['CWE-89 · verified'] },

        ],
        edges: [

          { d:'M530,100 L575,185 L620,185', label:'端点' },

          { x:30, y:210, w:920, h:150, label:'slot 1 · follower（Explore）' }
        ],
        nodes: [

          { id:'e-reason', x:560, y:90, w:180, h:56, c:5, title:'Reason · 扇出 2', sub:['maxIntentsPerReason=4 内'] },

          { id:'m-src', x:70, y:230, w:230, h:56, c:4, title:'SourceRef · 任务 A', sub:['findingId + sha256 指针'] },
          { id:'m-lesson', x:400, y:60, w:230, h:56, c:1, title:'Lesson · ffuf 限速', sub:['confirmed · reuseCount=3'] },
          { id:'m-hint', x:400, y:230, w:230, h:56, c:6, title:'Hint · 任务 C', sub:['source=system · title 注入'] },
          { id:'m-fact', x:720, y:230, w:200, h:56, c:6, title:"Fact' · 任务 C 复现", sub:['新任务自己的证据'] }
        ],
        edges: [
          { d:'M185,116 L185,230', label:'derived_from' },
          { d:'M515,116 L515,230', dash:true, label:'injected_as · 匹配 stack' },
          { d:'M630,258 L720,258', dash:true, label:'Observe 吸收（建议）' },
          { d:'M820,230 L820,88 L630,88', dash:true, label:'反馈 · reuseCount+1' }
        ]
      }
    };

    var DETAILS = {
      'asset:seed': { t:'seed 资产', b:['创建任务即 seedAssetsFromAuth 写入；控制台立刻可见。','授权边界圈由 targets（CIDR/通配）渲染；扩围只能人改契约。'], s:'asset-inventory.md' },
      'asset:www': { t:'admitted + family', b:['发现血缘：asset_record Fact.intentId → 枚举 Intent → sourceFactIds=seed。','familyKey=thinkphp 与 api 同族——technique_transfer 扇出候选（任务内）。'], s:'asset-inventory.md · graph-views.md §二' },
      'asset:api': { t:'live 资产', b:['asset_record(live=true) 升级；同地址取最高 kind。','跨图同 ID：攻击面图/执行图/记忆图都用 api.example.com 这个键跳转。'], s:'asset-inventory.md' },
      'asset:admin': { t:'oos 资产', b:['命中 outOfScope（覆盖 targets）；可记账不可作为利用 Intent 唯一前驱。','图上灰显、利用边禁连——可视化与 proposeIntent 硬闸同语义。'], s:'asset-inventory.md · long-run-contract.md' },
      'asset:host5': { t:'内网发现', b:['api 凭据 → pivot 发现；血缘边保留完整攻击路径。','孤岛检测：admitted 但无 Intent 触碰 → 图提示（只写 Hint）。'], s:'graph-views.md §四' },
      'surface:s-api': { t:'资产节点（跨图同 ID）', b:['与资产图同一 address 键；点击可跳回资产图看血缘与 family。'], s:'graph-views.md §三' },
      'surface:s-443': { t:'表面元素 · 服务', b:['来自 P6 E3 parser lane（nmap/httpx 结构化输出），原文 evidence 封存。','E3 前不硬解析自由文本——降级为资产×Goal 覆盖视图。'], s:'pentest-enhancements.md E3' },
      'surface:s-8080': { t:'attempted / blocked', b:['测试状态派生自 Intent 终态与 finding；blocked 进报告受阻项。','覆盖矩阵（E4）：asset×technique 粒度，不再是 goal 级。'], s:'pentest-enhancements.md E4' },
      'surface:s-login': { t:'端点 · verified', b:['verified 只认 verified finding（有 repro+证据），不认 nuclei 一条命中。','tentative 线索灰显不进交付——双图分离的可视化。'], s:'pentest-enhancements.md E1' },
      'surface:s-upload': { t:'untested · 图提示候选', b:['未测面清单直接对齐客户要的 coverage。','图提示：「/upload 尚无 technique 覆盖」→ source=system Hint，不派 Intent。'], s:'graph-views.md §四' },
      'surface:s-finding': { t:'Finding 徽章', b:['severity + status + 证据 SHA-256；点击下钻 repro 与封存原件。','与报告 §Findings 同源（P6 E1），图不存第二份。'], s:'pentest-enhancements.md E1' },
      'exec:e-step1': { t:'ExecutionStep', b:['execution-trace 已落盘：number/tools/tokens/workerSlot/shellCallCount。','成本归因：每步 token 直接可读，飞轮记分卡同源。'], s:'execution-trace.ts · data-flywheel.md §一①' },
      'exec:e-reason': { t:'Reason 步', b:['扇出硬顶内（≤4/波次、≤2/同根）；有 open Explore 时不跑 Reason。','slot 0 专属——leader 判定只看 slot===0。'], s:'long-run-contract.md' },
      'exec:e-step2': { t:'Explore 步 · claim', b:['Intent CAS claim 关联：step → Intent#1 → 产出 Fact（因果边经 events）。','多 slot 并行时各泳道独立时序，共享 History。'], s:'graph-views.md §二' },

      'exec:e-deny': { t:'gate 拒绝（红）', b:['rate/scope/capability 拒绝可视化；未执行但审计在。','高耗低产信号：同 Intent 反复被拒/换面 → 图提示换面（不终止）。'], s:'graph-views.md §四 · pentest-enhancements.md E4' },

    function el(name, attrs) {
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    function color(c) {
      return c === 0 ? 'var(--seed-muted)' : 'var(--viz-series-' + c + ')';
    }
    function showDetail(key, view) {
      var d = DETAILS[key] || VIEWS[view].overview;
      detail.innerHTML = '<h3></h3><ul></ul><div class="gv-src"></div>';
      detail.querySelector('h3').textContent = d.t;
      var ul = detail.querySelector('ul');
      d.b.forEach(function (line) {
        var li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      });
      detail.querySelector('.gv-src').textContent = '出处：' + d.s;
      var prev = document.querySelector('#gv-svg .gv-selected');
      if (prev) prev.classList.remove('gv-selected');
      var g = document.querySelector('#gv-svg [data-key="' + key + '"]');
      if (g) g.classList.add('gv-selected');
    }

    Object.keys(VIEWS).forEach(function (vk) {
      var v = VIEWS[vk];
      var g = document.getElementById('gv-view-' + vk);
      if (v.lanes) {
        v.lanes.forEach(function (ln) {
          g.appendChild(el('rect', { x:ln.x, y:ln.y, width:ln.w, height:ln.h, rx:12, fill:'none', stroke:'var(--border-subtle)', 'stroke-width':1.2, 'stroke-dasharray':'6 4' }));
          var t = el('text', { x:ln.x+14, y:ln.y+22, 'class':'gv-lane' });
          t.textContent = ln.label;
          g.appendChild(t);
        });
      }
      if (v.relay) {
        g.appendChild(el('path', { d:'M' + v.relay.x + ',50 L' + v.relay.x + ',380', 'class':'gv-edge gv-dash', stroke:'var(--viz-series-2)' }));
        var rt = el('text', { x:v.relay.x+6, y:400, 'class':'gv-edge-label' });
        rt.textContent = v.relay.label;
        g.appendChild(rt);
      }
      v.edges.forEach(function (e) {
        g.appendChild(el('path', { d:e.d, 'class':'gv-edge' + (e.dash ? ' gv-dash' : ''), 'marker-end':'url(#gv-arrow)' }));
        if (e.label) {
          var nums = e.d.match(/-?\d+(\.\d+)?/g).map(Number);
          var lx = nums[0] + 6, ly = nums[1] - 6;
          if (e.label.length > 8) { lx = nums[0] + 6; ly = nums[1] + 16; }
          var t = el('text', { x:lx, y:ly, 'class':'gv-edge-label' });
          t.textContent = e.label;
          g.appendChild(t);
        }
      });
      v.nodes.forEach(function (n) {
        var key = vk + ':' + n.id;
        var ng = el('g', { 'class':'gv-node', 'data-key':key, tabindex:0, role:'button', 'aria-label':n.title + '，查看规范' });
        var c = color(n.c);
        ng.appendChild(el('rect', { 'class':'gv-focusring', x:n.x-3, y:n.y-3, width:n.w+6, height:n.h+6, rx:12, fill:'none', stroke:'none' }));
        ng.appendChild(el('rect', { 'class':'gv-body', x:n.x, y:n.y, width:n.w, height:n.h, rx:10, fill:'var(--fill-1)', stroke:c, 'stroke-width':1.5, 'stroke-dasharray': n.c === 0 ? '5 4' : 'none' }));
        ng.appendChild(el('rect', { x:n.x, y:n.y+8, width:4, height:n.h-16, rx:2, fill:c }));
        var t = el('text', { x:n.x+16, y:n.y+22, 'class':'gv-title' });
        t.textContent = n.title;
        ng.appendChild(t);
        n.sub.forEach(function (line, i) {
          var s = el('text', { x:n.x+16, y:n.y+40+i*13, 'class':'gv-sub' });
          s.textContent = line;
          ng.appendChild(s);
        });
        ng.addEventListener('click', function () { showDetail(key, vk); });
        ng.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showDetail(key, vk); }
        });
        g.appendChild(ng);
      });
    });

    function switchView(vk) {
      current = vk;
      Object.keys(VIEWS).forEach(function (k) {
        document.getElementById('gv-view-' + k).style.display = k === vk ? '' : 'none';
      });
      var tabs = document.querySelectorAll('#gy-graph-views .gv-tabs button');
      tabs.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.view === vk ? 'true' : 'false'); });
      note.textContent = VIEWS[vk].note;
      showDetail(null, vk);
    }

    document.querySelectorAll('#gy-graph-views .gv-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { switchView(b.dataset.view); });
    });
    switchView('asset');
  })();
  </script>
</div>

</html>
